project: c-template
version: 0.0.1

stovetop:
  variables:
    SRC: src
    OUT: bin
    CFLAGS: -Wall -Wextra -O2
  runtime:
    type: gcc  # Will be overridden by user's choice (gcc/g++/clang/cc)
    version:
  commands:
    build: ${CFLAGS} ${SRC}/main.c -o ${OUT}/app
    run:
    executable: ${OUT}/app
    test:
    clean: rm -rf ${OUT}
    deploy:
  aliases: {}
  hooks:
  profiles:
